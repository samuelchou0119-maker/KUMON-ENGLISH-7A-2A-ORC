<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUMON 英文單字練習庫</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
      background-color: #f9f9f9;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      color: white;
      margin: 5px;
    }
    .btn-success { background-color: #28a745; }
    .btn-primary { background-color: #007bff; }
    select { padding: 10px; font-size: 16px; border-radius: 6px; margin-right: 10px; }
    .status-box { margin-top: 15px; padding: 12px; border-radius: 5px; font-weight: bold; }
    .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>KUMON 英文口說練功坊 (GitHub 獨立前端)</h2>
    
    <div style="margin-bottom: 15px;">
      <label for="levelSelect">選擇級別：</label>
      <select id="levelSelect">
        <option value="">載入中...</option>
      </select>
      <button class="btn btn-primary" onclick="loadWordsForLevel()">載入單字</button>
    </div>

    <div id="wordDisplay" style="font-size: 20px; font-weight: bold; margin: 15px 0; color: #333;">
      請先選擇級別並載入單字
    </div>

    <div>
      <button class="btn btn-success" onclick="startRecognition()">🎤 開始說英文單字進行辨識</button>
    </div>

    <div id="statusMessage" class="status-box" style="display: none;"></div>
  </div>

  <script>
    // 已填入你剛剛部署成功的真實 API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwj4-pG4KbhxwkYRwmggwcLVDB30aqT7riSo2p2lOM1SUP8AoZHwPYModjYR5zKWQc/exec";

    let currentWords = [];
    let recognition = null;

    // 網頁載入時自動取得級別清單
    window.onload = async function() {
      try {
        const response = await fetch(`${API_URL}?action=getLevels`);
        const levels = await response.json();
        const select = document.getElementById('levelSelect');
        select.innerHTML = '';
        
        if (levels.length === 0) {
          select.innerHTML = '<option value="">沒有找到級別資料</option>';
          return;
        }

        levels.forEach(lvl => {
          const opt = document.createElement('option');
          opt.value = lvl;
          opt.innerText = `級別 ${lvl}`;
          select.appendChild(opt);
        });
      } catch (err) {
        showStatus("⚠️ 無法連線至 Google 試算表後端，請確認 API 網址。", true);
      }
    };

    // 載入指定級別的單字
    async function loadWordsForLevel() {
      const level = document.getElementById('levelSelect').value;
      if (!level) return;

      showStatus("正在讀取單字...", false);
      try {
        const response = await fetch(`${API_URL}?action=getWords&level=${level}`);
        currentWords = await response.json();
        
        if (currentWords.length > 0) {
          document.getElementById('wordDisplay').innerText = `目標單字：${currentWords[0].word} (${currentWords[0].meaning})`;
          showStatus(`成功載入 ${currentWords.length} 個單字！`, false);
        } else {
          document.getElementById('wordDisplay').innerText = "此級別尚無單字";
          showStatus("該級別沒有資料", true);
        }
      } catch (err) {
        showStatus("⚠️ 讀取單字失敗", true);
      }
    }

    function showStatus(text, isError = false) {
      const statusBox = document.getElementById('statusMessage');
      statusBox.style.display = 'block';
      statusBox.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
      statusBox.innerText = text;
    }

    // 語音辨識核心 (因為在 GitHub 獨立網址執行，麥克風權限將正常彈出)
    function startRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showStatus("⚠️ 您的瀏覽器不支援語音辨識，請使用 Google Chrome。", true);
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
          showStatus("🎙️ 聆聽中... 請對著麥克風說出英文單字", false);
        };

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          showStatus(`✅ 辨識成功！您說的是：${transcript}`, false);
        };

        recognition.onerror = function(event) {
          if (event.error === 'not-allowed') {
            showStatus("❌ 麥克風權限被拒絕。請點擊網址列左側鎖頭開啟麥克風權限。", true);
          } else {
            showStatus(`❌ 辨識錯誤: ${event.error}`, true);
          }
        };
      }

      try {
        recognition.start();
      } catch (e) {
        showStatus("⚠️ 請重新點擊開始按鈕", true);
      }
    }
  </script>
</body>
</html>
