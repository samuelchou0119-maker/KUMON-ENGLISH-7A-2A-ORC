<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMON 英文口說練功坊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            color: white;
            margin: 5px;
        }
        .btn-success { background-color: #28a745; }
        .btn-primary { background-color: #007bff; }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            margin-right: 10px;
        }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
        }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>KUMON 英文口說練功坊</h2>
        
        <div style="margin-bottom: 15px;">
            <label for="levelSelect">選擇級別：</label>
            <select id="levelSelect">
                <option value="">載入中...</option>
            </select>
            <button class="btn btn-primary" onclick="loadWordsForLevel()">載入單字</button>
        </div>

        <div id="wordDisplay" style="font-size: 24px; font-weight: bold; margin: 20px 0; color: #333;">
            請先選擇級別並載入單字
        </div>

        <div>
            <button class="btn btn-success" onclick="startRecognition()">🎤 開始說英文單字進行辨識</button>
        </div>

        <div id="statusMessage" class="status-box" style="display: none;"></div>
    </div>

    <script>
        // 設定 Google Apps Script API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycby5hlX-192KdXv6GXF6y6umKYAJydeKWcnSpajsvr8D9uA7kFynL_U_2tZaU-zlgOFn/exec";
        
        let currentWords = [];
        let currentIndex = 0;
        let recognition = null;

        // 網頁載入時自動取得級別清單
        window.onload = async function () {
            try {
                const response = await fetch(`${API_URL}?action=getLevels`);
                const levels = await response.json();
                const select = document.getElementById('levelSelect');
                select.innerHTML = '';
                
                if (levels.length === 0) {
                    select.innerHTML = '<option value="">沒有找到級別資料</option>';
                    return;
                }
                
                levels.forEach(lvl => {
                    const opt = document.createElement('option');
                    opt.value = lvl;
                    opt.innerText = `級別 ${lvl}`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('無法連線至後端：', error);
                document.getElementById('levelSelect').innerHTML = '<option value="">連線失敗</option>';
                showStatus('⚠️ 無法連線至 Google 試算表後端，請確認 API 網址或網路狀況。', 'error');
            }
        };

        // 載入指定級別的單字
        async function loadWordsForLevel() {
            const level = document.getElementById('levelSelect').value;
            if (!level) {
                alert('請先選擇級別！');
                return;
            }

            try {
                showStatus('正在載入單字...', 'success');
                const response = await fetch(`${API_URL}?action=getWords&level=${level}`);
                currentWords = await response.json();

                if (currentWords.length > 0) {
                    currentIndex = 0;
                    displayCurrentWord();
                    showStatus(`成功載入 ${currentWords.length個單字}`, 'success');
                } else {
                    document.getElementById('wordDisplay').innerText = '此級別無單字';
                    showStatus('此級別沒有找到對應單字。', 'error');
                }
            } catch (error) {
                console.error('載入單字失敗：', error);
                showStatus('載入單字失敗，請稍後再試。', 'error');
            }
        }

        // 顯示當前單字
        function displayCurrentWord() {
            if (currentWords.length > 0 && currentIndex < currentWords.length) {
                document.getElementById('wordDisplay').innerText = currentWords[currentIndex];
            }
        }

        // 語音辨識功能
        function startRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的瀏覽器不支援語音辨識功能，請使用 Google Chrome 瀏覽器。');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            showStatus('🎤 請對著麥克風念出單字...', 'success');

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                const targetWord = currentWords[currentIndex] || '';

                if (spokenText.toLowerCase() === targetWord.toLowerCase()) {
                    showStatus(`✅ 答對了！你說的是：${spokenText}`, 'success');
                    // 自動跳到下一個單字
                    setTimeout(() => {
                        currentIndex = (currentIndex + 1) % currentWords.length;
                        displayCurrentWord();
                    }, 1500);
                } else {
                    showStatus(`❌ 辨識結果：${spokenText} (目標單字：${targetWord})，請再試一次！`, 'error');
                }
            };

            recognition.onerror = function(event) {
                showStatus(`⚠️ 語音辨識發生錯誤：${event.error}`, 'error');
            };

            recognition.start();
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.style.display = 'block';
            statusBox.innerText = message;
            statusBox.className = `status-box status-${type}`;
        }
    </script>
</body>
</html>
