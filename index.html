<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>KUMON 英文單字練習庫</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
      background-color: #f9f9f9;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      color: white;
      margin: 5px;
    }
    .btn-success { background-color: #28a745; }
    .status-box { margin-top: 15px; padding: 12px; border-radius: 5px; font-weight: bold; }
    .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>KUMON 英文口說練功坊</h2>
    <p>🎤 請點擊下方按鈕開始進行語音辨識練習：</p>
    
    <div>
      <button class="btn btn-success" onclick="startRecognition()">▶ 開始說英文單字</button>
    </div>

    <div id="statusMessage" class="status-box" style="display: none;"></div>
  </div>

  <script>
    let recognition = null;

    function showStatus(text, isError = false) {
      const statusBox = document.getElementById('statusMessage');
      statusBox.style.display = 'block';
      statusBox.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
      statusBox.innerText = text;
    }

    function startRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showStatus("⚠️ 您的瀏覽器不支援語音辨識，請使用 Google Chrome。", true);
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
          showStatus("🎙️ 聆聽中... 請對著麥克風說出單字", false);
        };

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          showStatus(`✅ 辨識成功！您說的是：${transcript}`, false);
        };

        recognition.onerror = function(event) {
          if (event.error === 'not-allowed') {
            showStatus("❌ 麥克風權限被拒絕 (not-allowed)。請檢查瀏覽器設定或系統設定允許存取麥克風。", true);
          } else {
            showStatus(`❌ 辨識錯誤: ${event.error}`, true);
          }
        };
      }

      try {
        recognition.start();
      } catch (e) {
        showStatus("⚠️ 請重新點擊開始按鈕", true);
      }
    }
  </script>
</body>
</html>
