<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMON 英文單字練習庫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            color: white;
            margin: 8px 5px;
            font-weight: bold;
        }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-info { background-color: #17a2b8; }
        .btn-info:hover { background-color: #138496; }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            margin-right: 10px;
        }
        .word-box {
            font-size: 44px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            color: #d9534f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .meaning-box {
            font-size: 22px;
            color: #6c757d;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-info { background-color: #e2f0fb; color: #004085; border: 1px solid #b8daff; }
    </style>
</head>
<body>

    <div class="card">
        <h2>KUMON 英文口說練功坊</h2>
        
        <div style="margin-bottom: 15px;">
            <label for="levelSelect">選擇級別：</label>
            <select id="levelSelect">
                <option value="">載入中...</option>
            </select>
            <button class="btn btn-primary" onclick="loadWordsForLevel()">載入單字</button>
        </div>

        <!-- 顯示單字與中文解釋 -->
        <div id="wordDisplay" class="word-box">請選擇級別</div>
        <div id="meaningDisplay" class="meaning-box">--</div>

        <div>
            <button class="btn btn-info" onclick="playPronunciation()">🔊 聽標準發音</button>
            <button class="btn btn-success" onclick="startRecognition()">🎤 點我唸單字 (語音辨識)</button>
        </div>

        <div id="statusMessage" class="status-box" style="display: none;"></div>
    </div>

    <script>
        // 對應最新部署的 Google Apps Script 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwj4-pG4KbhxwkYRwmggwcLVDB30aqT7riSo2p2lOM1SUP8AoZHwPYModjYR5zKWQc/exec";
        
        let currentWords = [];
        let currentIndex = 0;
        let recognition = null;

        // 網頁載入時自動取得級別清單
        window.onload = async function() {
            try {
                const response = await fetch(`${API_URL}?action=getLevels`);
                const levels = await response.json();
                const select = document.getElementById('levelSelect');
                select.innerHTML = '';
                
                if (!levels || levels.length === 0) {
                    select.innerHTML = '<option value="">沒有找到級別資料</option>';
                    return;
                }
                
                levels.forEach(lvl => {
                    const opt = document.createElement('option');
                    opt.value = lvl;
                    opt.innerText = `級別 ${lvl}`;
                    select.appendChild(opt);
                });

                // 自動載入第一個級別
                loadWordsForLevel();
            } catch (err) {
                showStatus("⚠️ 無法連線至 Google 試算表後端，請確認 API 網址。", true);
            }
        };

        // 載入指定級別的單字
        async function loadWordsForLevel() {
            const level = document.getElementById('levelSelect').value;
            if (!level) return;

            showStatus("正在讀取單字...", false);
            try {
                const response = await fetch(`${API_URL}?action=getWords&level=${level}`);
                currentWords = await response.json();

                if (Array.isArray(currentWords) && currentWords.length > 0) {
                    currentIndex = 0;
                    displayCurrentWord();
                    showStatus(`✅ 成功載入 ${level} 級別！共有 ${currentWords.length} 個單字，開始練習吧！`, false);
                } else {
                    document.getElementById('wordDisplay').innerText = "此級別尚無單字";
                    document.getElementById('meaningDisplay').innerText = "--";
                    showStatus("該級別沒有資料", true);
                }
            } catch (err) {
                showStatus("⚠️ 讀取單字失敗", true);
            }
        }

        // 顯示當前單字與中文解釋
        function displayCurrentWord() {
            if (currentWords.length > 0 && currentIndex < currentWords.length) {
                const item = currentWords[currentIndex];
                document.getElementById('wordDisplay').innerText = item.word;
                document.getElementById('meaningDisplay').innerText = `（ ${item.meaning} ）`;
            }
        }

        // 🔊 語音合成發音
        function playPronunciation() {
            if (currentWords.length === 0) return;
            const targetWord = currentWords[currentIndex].word;
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(targetWord);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音朗讀功能。');
            }
        }

        // 🎤 語音辨識與評分
        function startRecognition() {
            if (currentWords.length === 0) {
                alert('請先載入單字！');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showStatus("⚠️ 您的瀏覽器不支援語音辨識，請使用 Google Chrome。", true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            showStatus("🎙️ 聆聽中... 請對著麥克風說出英文單字", false);

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim().toLowerCase();
                const targetWord = String(currentWords[currentIndex].word).trim().toLowerCase();

                if (spokenText === targetWord) {
                    showStatus(`⭐ 評分：100分！太棒了！<br>你正確唸出了：<b>${event.results[0][0].transcript}</b>`, false);
                    
                    // 自動跳到下一個單字
                    setTimeout(() => {
                        currentIndex++;
                        if (currentIndex < currentWords.length) {
                            displayCurrentWord();
                            showStatus("🎤 太棒了！請繼續唸下一個單字", false);
                        } else {
                            document.getElementById('wordDisplay').innerText = "🎉 恭喜通關！";
                            document.getElementById('meaningDisplay').innerText = "太厲害了";
                            showStatus("🏆 這個級別的單字全部完美通關！", false);
                        }
                    }, 1500);
                } else {
                    showStatus(`❌ 哎呀，差一點點！<br>• 你唸成：<b>"${event.results[0][0].transcript}"</b><br>• 正確目標：<b>"${currentWords[currentIndex].word}" (${currentWords[currentIndex].meaning})</b><br>💡 點擊上方藍色按鈕再聽一次發音！`, true);
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') {
                    showStatus("❌ 麥克風權限被拒絕。請點擊網址列左側鎖頭開啟麥克風權限。", true);
                } else {
                    showStatus(`❌ 辨識錯誤: ${event.error}，請再試一次`, true);
                }
            };

            try {
                recognition.start();
            } catch (e) {
                showStatus("⚠️ 請重新點擊開始按鈕", true);
            }
        }

        function showStatus(text, isError = false) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.style.display = 'block';
            statusBox.innerHTML = text;
            statusBox.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
        }
    </script>
</body>
</html>
