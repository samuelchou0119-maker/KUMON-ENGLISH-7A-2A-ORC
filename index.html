<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMON 英文口說練功坊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            color: white;
            margin: 6px 4px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-success { background-color: #28a745; width: 100%; }
        .btn-success:hover { background-color: #218838; }
        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-info { background-color: #17a2b8; }
        .btn-info:hover { background-color: #138496; }
        .btn-warning { background-color: #ffc107; color: #333; }
        .btn-warning:hover { background-color: #e0a800; }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 15px;
        }
        .word-box {
            font-size: 52px;
            font-weight: bold;
            margin: 20px 0 5px 0;
            color: #d9534f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .meaning-box {
            font-size: 24px;
            color: #6c757d;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-info { background-color: #e2f0fb; color: #004085; border: 1px solid #b8daff; }
        
        /* 彈出視窗樣式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
        }
        .close-btn {
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }
        .close-btn:hover { color: #000; }
        .word-list-item {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>KUMON 英文口說練功坊</h2>
        
        <div>
            <select id="levelSelect" onchange="loadWordsForLevel()">
                <!-- 動態載入級別 -->
            </select>
        </div>

        <!-- 顯示單字與中文解釋 -->
        <div id="wordDisplay" class="word-box">請選擇級別</div>
        <div id="meaningDisplay" class="meaning-box">--</div>

        <div style="display: flex; gap: 5px; margin-bottom: 8px;">
            <button class="btn btn-info" style="flex: 1;" onclick="playPronunciation()">🔊 聽發音</button>
            <button class="btn btn-warning" style="flex: 1;" onclick="openWordListModal()">📚 單字庫總覽</button>
        </div>

        <div>
            <button class="btn btn-success" onclick="startRecognition()">🎤 點我唸單字 (語音辨識)</button>
        </div>

        <div id="statusMessage" class="status-box" style="display: none;"></div>
    </div>

    <!-- 單字庫彈出視窗 -->
    <div id="wordListModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeWordListModal()">&times;</span>
            <h3 id="modalTitle" style="margin-top: 0; color: #2c3e50;">單字庫</h3>
            <div id="modalWordList"></div>
        </div>
    </div>

    <script>
        const fullDatabase = {
            "7A": [
                {word: "dog", meaning: "狗"}, {word: "cat", meaning: "貓"}, {word: "cow", meaning: "乳牛"}, {word: "rabbit", meaning: "兔子"}, {word: "car", meaning: "汽車"}, {word: "bus", meaning: "公車"}, {word: "bike", meaning: "腳踏車"}, {word: "truck", meaning: "卡車"}, {word: "egg", meaning: "蛋"}, {word: "milk", meaning: "牛奶"}, {word: "bread", meaning: "麵包"}, {word: "butter", meaning: "奶油"}, {word: "apple", meaning: "蘋果"}, {word: "lemon", meaning: "檸檬"}, {word: "banana", meaning: "香蕉"}, {word: "orange", meaning: "橘子"}, {word: "eye", meaning: "眼睛"}, {word: "ear", meaning: "耳朵"}, {word: "nose", meaning: "鼻子"}, {word: "mouth", meaning: "嘴巴"}, {word: "hand", meaning: "手"}, {word: "foot", meaning: "腳"}, {word: "hair", meaning: "頭髮"}, {word: "head", meaning: "頭"}, {word: "bed", meaning: "床"}, {word: "piano", meaning: "鋼琴"}, {word: "desk", meaning: "書桌"}, {word: "chair", meaning: "椅子"}, {word: "sofa", meaning: "沙發"}, {word: "table", meaning: "桌子"}, {word: "tv", meaning: "電視"}, {word: "door", meaning: "門"}, {word: "bag", meaning: "提袋/包包"}, {word: "cap", meaning: "帽子(鴨舌帽)"}, {word: "coat", meaning: "外套/大衣"}, {word: "shoe", meaning: "鞋子"}, {word: "lion", meaning: "獅子"}, {word: "bear", meaning: "熊"}, {word: "sheep", meaning: "綿羊"}, {word: "deer", meaning: "鹿"}, {word: "sea", meaning: "海"}, {word: "sun", meaning: "太陽"}, {word: "star", meaning: "星星"}, {word: "moon", meaning: "月亮"}, {word: "ship", meaning: "船(輪船)"}, {word: "train", meaning: "火車"}, {word: "boat", meaning: "小船"}, {word: "plane", meaning: "飛機"}, {word: "cup", meaning: "杯子"}, {word: "fork", meaning: "叉子"}, {word: "spoon", meaning: "湯匙"}, {word: "plate", meaning: "盤子"}, {word: "corn", meaning: "玉米"}, {word: "carrot", meaning: "胡蘿蔔"}, {word: "potato", meaning: "馬鈴薯"}, {word: "tomato", meaning: "番茄"}, {word: "pants", meaning: "長褲"}, {word: "sock", meaning: "襪子"}, {word: "shirt", meaning: "襯衫"}, {word: "skirt", meaning: "裙子"}, {word: "sky", meaning: "天空"}, {word: "tree", meaning: "樹"}, {word: "rain", meaning: "雨"}, {word: "flower", meaning: "花"}
            ],
            "6A": [
                {word: "red", meaning: "紅色的"}, {word: "blue", meaning: "藍色的"}, {word: "yellow", meaning: "黃色的"}, {word: "pink", meaning: "粉紅色的"}, {word: "green", meaning: "綠色的"}, {word: "brown", meaning: "棕色的"}, {word: "black", meaning: "黑色的"}, {word: "white", meaning: "白色的"}, {word: "one", meaning: "一"}, {word: "two", meaning: "二"}, {word: "three", meaning: "三"}, {word: "four", meaning: "四"}, {word: "five", meaning: "五"}, {word: "six", meaning: "六"}, {word: "seven", meaning: "七"}, {word: "eight", meaning: "八"}, {word: "nine", meaning: "九"}, {word: "ten", meaning: "十"}, {word: "duck", meaning: "鴨子"}, {word: "ball", meaning: "球"}, {word: "book", meaning: "書"}, {word: "umbrella", meaning: "雨傘"}, {word: "bird", meaning: "鳥"}, {word: "pencil", meaning: "鉛筆"}, {word: "leaf", meaning: "葉子"}, {word: "dress", meaning: "洋裝"}, {word: "big", meaning: "大的"}, {word: "box", meaning: "盒子/箱子"}, {word: "small", meaning: "小的"}, {word: "fish", meaning: "魚"}, {word: "hat", meaning: "帽子(有簷帽)"}, {word: "long", meaning: "長的"}, {word: "short", meaning: "短的/矮的"}, {word: "tie", meaning: "領帶"}, {word: "belt", meaning: "皮帶"}, {word: "ruler", meaning: "尺"}, {word: "tall", meaning: "高的"}, {word: "boy", meaning: "男孩"}, {word: "girl", meaning: "女孩"}, {word: "glass", meaning: "玻璃杯"}, {word: "new", meaning: "新的"}, {word: "old", meaning: "舊的"}, {word: "clock", meaning: "時鐘"}, {word: "house", meaning: "房子"}, {word: "fridge", meaning: "冰箱"}, {word: "heavy", meaning: "重的"}, {word: "light", meaning: "輕的"}, {word: "rock", meaning: "岩石/石頭"}, {word: "thick", meaning: "厚的"}, {word: "thin", meaning: "薄的"}, {word: "blanket", meaning: "毯子"}, {word: "sweater", meaning: "毛衣"}, {word: "fast", meaning: "快的"}, {word: "slow", meaning: "慢的"}, {word: "horse", meaning: "馬"}, {word: "left", meaning: "左邊的"}, {word: "right", meaning: "右邊的"}, {word: "leg", meaning: "腿"}, {word: "arm", meaning: "手臂"}, {word: "wing", meaning: "翅膀"}
            ],
            "5A": [
                {word: "o'clock", meaning: "點鐘"}, {word: "sunny", meaning: "晴朗的"}, {word: "cloudy", meaning: "多雲的"}, {word: "snow", meaning: "雪/下雪"}, {word: "walk", meaning: "走路"}, {word: "run", meaning: "跑步"}, {word: "jump", meaning: "跳"}, {word: "swim", meaning: "游泳"}, {word: "sit", meaning: "坐"}, {word: "man", meaning: "男人"}, {word: "sleep", meaning: "睡覺"}, {word: "woman", meaning: "女人"}, {word: "sing", meaning: "唱歌"}, {word: "baby", meaning: "嬰兒"}, {word: "cry", meaning: "哭"}, {word: "laugh", meaning: "笑"}, {word: "turtle", meaning: "烏龜"}, {word: "fly", meaning: "飛"}, {word: "kite", meaning: "風箏"}, {word: "camera", meaning: "照相機"}, {word: "notebook", meaning: "筆記本"}, {word: "drum", meaning: "鼓"}, {word: "guitar", meaning: "吉他"}, {word: "bridge", meaning: "橋"}, {word: "full", meaning: "滿的"}, {word: "empty", meaning: "空的"}, {word: "bottle", meaning: "瓶子"}, {word: "doll", meaning: "洋娃娃"}
            ],
            "4A": [
                {word: "ice", meaning: "冰塊"}, {word: "jacket", meaning: "夾克外套"}, {word: "king", meaning: "國王"}, {word: "queen", meaning: "皇后/女王"}, {word: "toy", meaning: "玩具"}, {word: "vest", meaning: "背心"}, {word: "zebra", meaning: "斑馬"}, {word: "parrot", meaning: "鸚鵡"}, {word: "ant", meaning: "螞蟻"}, {word: "bat", meaning: "球棒"}, {word: "pen", meaning: "筆"}, {word: "ill", meaning: "生病的"}, {word: "insect", meaning: "昆蟲"}, {word: "dish", meaning: "盤子/碟子"}, {word: "pond", meaning: "池塘"}, {word: "fat", meaning: "胖的"}, {word: "fence", meaning: "柵欄"}, {word: "fox", meaning: "狐狸"}, {word: "hill", meaning: "山丘"}, {word: "honey", meaning: "蜂蜜"}, {word: "map", meaning: "地圖"}, {word: "mirror", meaning: "鏡子"}, {word: "monkey", meaning: "猴子"}, {word: "lamp", meaning: "檯燈"}, {word: "letter", meaning: "信件"}, {word: "lunch", meaning: "午餐"}, {word: "net", meaning: "網子"}, {word: "neck", meaning: "脖子"}, {word: "nest", meaning: "鳥巢"}, {word: "nut", meaning: "堅果"}, {word: "pig", meaning: "豬"}, {word: "river", meaning: "河流"}, {word: "sandwich", meaning: "三明治"}, {word: "taxi", meaning: "計程車"}, {word: "ticket", meaning: "票券"}, {word: "tunnel", meaning: "隧道"}, {word: "gate", meaning: "大門"}, {word: "golf", meaning: "高爾夫球"}, {word: "jam", meaning: "果醬"}, {word: "kick", meaning: "踢"}, {word: "kitchen", meaning: "廚房"}, {word: "violin", meaning: "小提琴"}, {word: "watch", meaning: "手錶"}, {word: "window", meaning: "窗戶"}, {word: "zipper", meaning: "拉鍊"}
            ],
            "3A": [
                {word: "wall", meaning: "牆壁"}, {word: "grass", meaning: "草地"}, {word: "glasses", meaning: "眼鏡"}, {word: "classroom", meaning: "教室"}, {word: "bench", meaning: "長凳"}, {word: "cheese", meaning: "起司"}, {word: "phone", meaning: "電話"}, {word: "elephant", meaning: "大象"}, {word: "photo", meaning: "照片"}, {word: "dolphin", meaning: "海豚"}, {word: "ring", meaning: "戒指"}, {word: "birthday", meaning: "生日"}, {word: "father", meaning: "爸爸"}, {word: "mother", meaning: "媽媽"}, {word: "breakfast", meaning: "早餐"}, {word: "drive", meaning: "駕駛/開車"}, {word: "drink", meaning: "喝"}, {word: "cloud", meaning: "雲朵"}, {word: "clean", meaning: "打掃/乾淨的"}, {word: "stick", meaning: "木棍"}, {word: "cake", meaning: "蛋糕"}, {word: "face", meaning: "臉"}, {word: "lake", meaning: "湖泊"}, {word: "salt", meaning: "鹽巴"}, {word: "computer", meaning: "電腦"}, {word: "music", meaning: "音樂"}, {word: "pull", meaning: "拉"}, {word: "push", meaning: "推"}, {word: "bee", meaning: "蜜蜂"}, {word: "tail", meaning: "尾巴"}, {word: "nail", meaning: "指甲/釘子"}, {word: "goat", meaning: "山羊"}, {word: "soap", meaning: "肥皂"}, {word: "mouse", meaning: "老鼠"}, {word: "mountain", meaning: "高山"}, {word: "zoo", meaning: "動物園"}, {word: "school", meaning: "學校"}, {word: "cook", meaning: "廚師/烹飪"}, {word: "wood", meaning: "木頭"}, {word: "cookie", meaning: "餅乾"}, {word: "tea", meaning: "茶"}, {word: "eat", meaning: "吃"}, {word: "meat", meaning: "肉"}, {word: "towel", meaning: "毛巾"}, {word: "arrow", meaning: "箭"}, {word: "crow", meaning: "烏鴉"}, {word: "rainbow", meaning: "彩虹"}, {word: "play", meaning: "玩耍"}, {word: "crayon", meaning: "蠟筆"}, {word: "gray", meaning: "灰色的"}, {word: "key", meaning: "鑰匙"}, {word: "money", meaning: "金錢"}, {word: "card", meaning: "卡片"}, {word: "park", meaning: "公園"}, {word: "tiger", meaning: "老虎"}, {word: "water", meaning: "水"}, {word: "dinner", meaning: "晚餐"}, {word: "nurse", meaning: "護理師"}
            ],
            "2A": [
                {word: "basket", meaning: "籃子"}, {word: "snake", meaning: "蛇"}, {word: "newspaper", meaning: "報紙"}, {word: "building", meaning: "建築物"}, {word: "frog", meaning: "青蛙"}, {word: "drawer", meaning: "抽屜"}
            ]
        };

        let currentWords = [];
        let currentIndex = 0;
        let recognition = null;

        window.onload = function() {
            const select = document.getElementById('levelSelect');
            select.innerHTML = '';
            
            Object.keys(fullDatabase).forEach(lvl => {
                const opt = document.createElement('option');
                opt.value = lvl;
                opt.innerText = `KUMON 級別 ${lvl} (共 ${fullDatabase[lvl].length} 個單字)`;
                select.appendChild(opt);
            });

            loadWordsForLevel();
        };

        // 隨機打亂陣列的函數 (Fisher-Yates shuffle)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadWordsForLevel() {
            const level = document.getElementById('levelSelect').value;
            let rawList = fullDatabase[level] || [];
            
            // 每次載入或切換級別時，自動隨機打亂單字順序，不再每次都從 dog 開始！
            currentWords = shuffleArray(rawList);
            currentIndex = 0;

            if (currentWords.length > 0) {
                displayCurrentWord();
                showStatus(`✅ 成功載入級別 ${level}！已隨機打亂順序，開始練習吧！`, 'success');
            } else {
                showStatus('⚠️ 此級別尚無單字', 'error');
            }
        }

        function displayCurrentWord() {
            if (currentWords.length > 0 && currentIndex < currentWords.length) {
                const item = currentWords[currentIndex];
                document.getElementById('wordDisplay').innerText = item.word;
                document.getElementById('meaningDisplay').innerText = `（ ${item.meaning} ）`;
            }
        }

        // 開啟單字庫視窗
        function openWordListModal() {
            const level = document.getElementById('levelSelect').value;
            const list = fullDatabase[level] || [];
            
            document.getElementById('modalTitle').innerText = `KUMON 級別 ${level} 單字總覽`;
            const container = document.getElementById('modalWordList');
            container.innerHTML = '';

            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'word-list-item';
                div.innerHTML = `<b>${index + 1}. ${item.word}</b> - ${item.meaning}`;
                container.appendChild(div);
            });

            document.getElementById('wordListModal').style.display = 'flex';
        }

        // 關閉單字庫視窗
        function closeWordListModal() {
            document.getElementById('wordListModal').style.display = 'none';
        }

        function playPronunciation() {
            if (currentWords.length === 0) return;
            const targetWord = currentWords[currentIndex].word;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(targetWord);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音功能');
            }
        }

        function startRecognition() {
            if (currentWords.length === 0) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showStatus("⚠️ 您的瀏覽器不支援語音辨識，請使用 Google Chrome 瀏覽器。", true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            showStatus("🎙️ 聆聽中... 請對著麥克風大聲唸出單字！", 'info');

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim().toLowerCase();
                const targetWord = String(currentWords[currentIndex].word).trim().toLowerCase();

                if (spokenText === targetWord) {
                    showStatus(`⭐ 評分：100分！太棒了！<br>你正確唸出了：<b>${event.results[0][0].transcript}</b>`, 'success');
                    
                    setTimeout(() => {
                        currentIndex++;
                        if (currentIndex < currentWords.length) {
                            displayCurrentWord();
                            showStatus("🎤 太棒了！請繼續唸下一個單字", 'info');
                        } else {
                            document.getElementById('wordDisplay').innerText = "🎉 恭喜通關！";
                            document.getElementById('meaningDisplay').innerText = "太厲害了";
                            showStatus("🏆 這個級別的單字全部完美通關！", 'success');
                        }
                    }, 1500);
                } else {
                    showStatus(`❌ 哎呀，差一點點！<br>• 你唸成：<b>"${event.results[0][0].transcript}"</b><br>• 正確目標：<b>"${currentWords[currentIndex].word}" (${currentWords[currentIndex].meaning})</b><br>💡 點擊上方藍色按鈕再聽一次標準發音！`, 'error');
                }
            };

            recognition.onerror = function(event) {
                showStatus(`⚠️ 語音辨識發生狀況 (${event.error})，請再試一次！`, 'error');
            };

            try {
                recognition.start();
            } catch (e) {
                showStatus("⚠️ 請重新點擊開始按鈕", 'error');
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.style.display = 'block';
            statusBox.innerHTML = message;
            statusBox.className = `status-box status-${type}`;
        }
    </script>
</body>
</html>
